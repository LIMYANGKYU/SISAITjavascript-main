<!DOCTYPE html>
<html>
<head>
</head>
<body>

    <img id="image" src="img/cat.jpg" width="120" height="100">

    <script>
        function changeImage() {
            let img = document.getElementById("image");

            if (img.getAttribute("src") === "img/cat.jpg") {
                img.src = "img/cat2.jpg";
            } else {
                img.src = "img/cat.jpg";
            }
        }
    </script>

    <input type="button" onclick="changeImage()" value="click!">
</body>
</html>
